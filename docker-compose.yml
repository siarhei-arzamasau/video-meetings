name: video-meetings

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_meetings
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d video_meetings']
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies the committed migrations and exits; `api` waits for it to succeed. A service of
  # its own rather than a step in the API's start command: it runs once however many `api`
  # containers start, and a migration that fails stops the stack before an API boots on a
  # schema it does not match. `migrate deploy`, as in `pnpm start:dev` — it applies what is
  # committed and can neither generate a migration nor reset the database.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/video_meetings
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/video_meetings
      # Deliberately undefaulted. A fallback here would be a signing key published in this
      # repository, long enough to satisfy the 32-character rule and therefore accepted at
      # boot — anyone could then mint a token for any user id. Unset, compose passes an
      # empty string, env.validation.ts refuses to start, and `docker compose up -d postgres`
      # still works without a root .env because compose only warns on an unset variable.
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      AUTH_RATE_LIMIT_ATTEMPTS: ${AUTH_RATE_LIMIT_ATTEMPTS:-10}
      # 0 while this container is reached directly; the number of proxies once one fronts it.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      # The web service below, as a browser reaches it. Production refuses to boot without an
      # origin list; set this to the public origin once the stack is served from one.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MEETING_FILES_DIR: /data/meeting-files
      # Transcription is off unless the root .env turns it on, and the URL defaults to the
      # `whisper` service below by its in-network name. The API boots and serves uploads
      # whether or not that service is running, which is why nothing here depends on it.
      MEETING_FILES_TRANSCRIPTION_ENABLED: ${MEETING_FILES_TRANSCRIPTION_ENABLED:-false}
      TRANSCRIPTION_API_URL: ${TRANSCRIPTION_API_URL:-http://whisper:8000/v1/audio/transcriptions}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      # The model the `whisper` service preloads (its WHISPER_MODEL); the two must agree.
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-Systran/faster-whisper-small}
      # A one-hour recording at twice the rate measured for this service: 5.3 to 6.0 seconds
      # of work per minute of audio on an 18-core Apple Silicon laptop (2026-10-07).
      TRANSCRIPTION_TIMEOUT_SECONDS: ${TRANSCRIPTION_TIMEOUT_SECONDS:-720}
    ports:
      - '3001:3001'
    volumes:
      # A named volume, so a rebuilt container keeps its uploads. The Dockerfile creates and
      # chowns this directory, which Docker copies onto the volume on its first mount.
      - meeting-files:/data/meeting-files
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      - api

  # Whisper `small`, served by Speaches over the OpenAI `audio/transcriptions` shape. Opt-in:
  #   docker compose --profile transcription up -d whisper
  # A profile, because `pnpm start:dev` runs `docker compose up -d postgres` and a plain
  # `docker compose up` must keep starting only what every developer needs.
  whisper:
    profiles: ['transcription']
    # A release tag, never `latest-cpu`: that tag is still 0.8.3, which has no PRELOAD_MODELS.
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    restart: unless-stopped
    environment:
      # The model the wrapper below preloads. `TRANSCRIPTION_MODEL` has to name the same one:
      # the server answers 404 for a model it has not downloaded.
      WHISPER_MODEL: Systran/faster-whisper-small
    # The image's own command, behind one decision. Speaches' PRELOAD_MODELS asks Hugging Face
    # which models exist before it looks at its own cache, so set unconditionally it stops the
    # service from starting without the network. It is therefore set only while the volume
    # lacks the model (about 0.5 GB, the one start that needs the network); once the files are
    # there the server starts with HF_HUB_OFFLINE=1 and asks Hugging Face for nothing.
    entrypoint:
      - /bin/sh
      - -c
      - |
        snapshot="$$HOME/.cache/huggingface/hub/models--$$(echo "$$WHISPER_MODEL" | sed 's|/|--|')/snapshots"
        cached=yes
        for file in README.md config.json model.bin tokenizer.json 'vocabulary.*'; do
          ls "$$snapshot"/*/$$file >/dev/null 2>&1 || cached=no
        done
        if [ "$$cached" = yes ]; then
          export HF_HUB_OFFLINE=1
        else
          export PRELOAD_MODELS="[\"$$WHISPER_MODEL\"]"
        fi
        exec uvicorn --factory speaches.main:create_app
    ports:
      # Loopback only: the server runs without authentication, and only an API running on
      # this host needs the published port. The `api` service above uses the Compose network.
      - '127.0.0.1:${WHISPER_PORT:-8000}:8000'
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent --output /dev/null http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 6
      # The first start is not healthy until the model has been downloaded.
      start_period: 10m

volumes:
  postgres-data:
  meeting-files:
  whisper-models:
